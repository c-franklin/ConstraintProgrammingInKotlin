plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.10'
    id 'application'
}

group = 'com.cpik'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'

    // https://mvnrepository.com/artifact/com.google.ortools/ortools-java
    implementation("com.google.ortools:ortools-java:9.11.4210")
}

application {
    mainClass = 'com.cpik.NQueensWebUIKt'
}

// Task to open the generated HTML file in the default browser
task openWebPage(type: Exec) {
    def htmlFile = file('web/nqueens_solution.html')
    
    doFirst {
        if (!htmlFile.exists()) {
            throw new GradleException("HTML file not found: ${htmlFile.absolutePath}")
        }
    }
    
    // Cross-platform browser opening
    if (System.properties['os.name'].toLowerCase().contains('mac')) {
        commandLine 'open', htmlFile.absolutePath
    } else if (System.properties['os.name'].toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'start', htmlFile.absolutePath
    } else {
        commandLine 'xdg-open', htmlFile.absolutePath
    }
}

// Make run task automatically open the web page
run.finalizedBy openWebPage

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(21)
}